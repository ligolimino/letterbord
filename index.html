<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letterbord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --achtergrond: #e3ebe8;
        --vlek: #cfdcd7;
        --vlek-donker: #b9c4cc;
        --tegel: #f6f6f5;
        --klinker: #13b5bb;
        --medeklinker: #145c7c;
        --lijn: #7d9a90;
        --lijn-donker: #4d5a6b;
        --icoon: #8fa59c;
        --schaduw: rgba(40, 60, 55, 0.18);
        --overlay: rgba(30, 40, 45, 0.55);
        --kaart: #f7f7f7;
        --sluit: #3b3f44;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --achtergrond: #e3ebe8;
        }
    }
    :root[data-theme="dark"] {
        --achtergrond: #e3ebe8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0;
        height: 100%;
        background: var(--achtergrond);
        font-family: "Andika", "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
    }

    .bord {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--pad);
        overflow: hidden;
    }
    /* De tegels zelf: zo smal en laag als ze zijn, midden in het vak. */
    .inhoud {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap);
        z-index: 1;
    }
    .icoon-ruimte { height: calc(var(--t) * 0.62); }
    [data-uitlijning="links"] .inhoud { align-items: flex-start; }
    [data-uitlijning="rechts"] .inhoud { align-items: flex-end; }
    [data-uitlijning="links"] .modus-icoon { left: auto; right: 0; }

    /* Decoratieve vlekken in de hoeken, zoals in het Genially-bord */
    .vlek { position: absolute; pointer-events: none; }
    .vlek.lb { top: -40px; left: -50px; width: 160px; height: 90px; border-radius: 50%; background: var(--vlek); }
    .vlek.rb { top: 10px; right: 8px; width: 40px; height: 22px; border-radius: 45% 55% 50% 40%; background: var(--vlek); }
    .vlek.lo { bottom: 30px; left: -18px; width: 36px; height: 42px; border-radius: 50%; background: var(--vlek-donker); opacity: .7; }
    .vlek.ro { bottom: -60px; right: -40px; width: 180px; height: 120px; border-radius: 50%; background: var(--vlek); }

    .rij {
        display: flex;
        justify-content: center;
        gap: var(--gap);
        position: relative;
        z-index: 1;
    }
    .scheiding {
        width: calc(var(--t) * var(--kol, 5) + var(--gap) * (var(--kol, 5) - 1));
        max-width: 100%;
        height: 2px;
        background: var(--lijn);
        opacity: .8;
        margin: calc(var(--gap) * 0.4) 0;
        position: relative;
        z-index: 1;
    }
    .scheiding.donker { background: var(--lijn-donker); }

    .tegel {
        width: var(--t);
        height: calc(var(--t) * 0.82);
        border: none;
        border-radius: calc(var(--t) * 0.14);
        background: var(--tegel);
        box-shadow: 0 calc(var(--t) * 0.05) calc(var(--t) * 0.14) var(--schaduw);
        font-family: inherit;
        font-size: calc(var(--t) * 0.5);
        line-height: 1;
        color: var(--medeklinker);
        cursor: pointer;
        padding: 0 0 calc(var(--t) * 0.06);
        transition: transform .12s ease, box-shadow .12s ease;
        touch-action: manipulation;
    }
    .tegel.klinker { color: var(--klinker); }
    .tegel.breed { font-size: calc(var(--t) * 0.46); }
    .tegel:active, .tegel.ingedrukt {
        transform: translateY(2px) scale(.97);
        box-shadow: 0 1px calc(var(--t) * 0.06) var(--schaduw);
    }
    .tegel:focus-visible { outline: 3px solid var(--klinker); outline-offset: 2px; }

    /* Subtiel modus-icoon linksonder */
    .modus-icoon {
        position: absolute;
        left: 0;
        bottom: 0;
        width: calc(var(--t) * 1.1);
        height: calc(var(--t) * 0.74);
        color: var(--icoon);
        opacity: .55;
        pointer-events: none;
        z-index: 0;
    }

    /* Vergroot-venster */
    .overlay {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s ease;
        z-index: 10;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .venster { position: relative; transform: scale(.92); transition: transform .18s ease; }
    .overlay.open .venster { transform: scale(1); }
    .kaart {
        position: relative;
        width: min(86vw, 70vh);
        aspect-ratio: 1 / 1;
        background: var(--kaart);
        border-radius: 7%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .kaart.letter { aspect-ratio: 4 / 3; }
    .groot {
        font-size: min(42vw, 34vh);
        line-height: 1;
        font-weight: 400;
        color: var(--medeklinker);
        padding-bottom: 4%;
    }
    .groot.klinker { color: var(--klinker); }
    .kaart.film { background: #fff; isolation: isolate; }
    .kaart video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
        display: block;
        border-radius: inherit;
    }
    .sluit {
        position: absolute;
        top: -16px;
        right: -16px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: var(--sluit);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 11;
        box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .sluit svg { width: 16px; height: 16px; }
    .opnieuw {
        position: absolute;
        right: 4%;
        bottom: 4%;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: none;
        background: rgba(20, 92, 124, .1);
        color: var(--medeklinker);
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
    }
    .opnieuw.zichtbaar { display: flex; }
    .opnieuw svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<main class="bord" id="bord" aria-label="Letterbord">
    <div class="vlek lb"></div><div class="vlek rb"></div><div class="vlek lo"></div><div class="vlek ro"></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="venster">
        <div class="kaart" id="kaart"></div>
        <button class="sluit" id="sluit" aria-label="Sluiten">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
        </button>
    </div>
</div>

<script>
    /* ============================================================
       LETTERBORD - instellingen
       Kies het bord en de werking via de link:
         ?bord=letters    alle letters en klanken
         ?bord=cijfers    0 tot 9
         ?bord=getallen   0 tot 50
       en
         &modus=lezen      klik = klank
         &modus=groot      klik = klank + grote letter
         &modus=schrijven  klik = klank + schrijffilmpje
       Voorbeeld: index.html?bord=getallen&modus=schrijven

       Een eigen bord (zo maakt de createpagina het):
         ?rijen=ng,nk,sch|-|sl,sp,st
       Elke rij gescheiden door |, de tekens door komma's.
       Een rij met alleen - is een lichte lijn, met = een donkere lijn.
       Klinkers worden vanzelf turquoise; getallen gebruiken de
       getallenopnames.
       ============================================================ */
    const ASSETS = "https://ligolimino.github.io/assets/";
    const BASIS_AUDIO = ASSETS + "audio/";
    const BASIS_VIDEO = ASSETS + "video/schrijven/";

    // Afwijkende geluidsbestanden (teken -> bestandsnaam zonder .mp3)
    const AUDIO_ALIAS = { ij: "ij-ei", ei: "ij-ei", au: "ou" };

    const reeks = (van, tot) => Array.from({ length: tot - van + 1 }, (_, i) => String(van + i));

    // Een groep heeft ofwel vaste "rijen", ofwel een lijst "tekens" die per
    // "perRij" (smal scherm) of "perRijBreed" (breed scherm) verdeeld wordt.
    const BORDEN = {
        letters: [
            { soort: "klinker", rijen: [["i", "a", "e", "o", "u"]] },
            { lijn: "licht" },
            { soort: "klinker", rijen: [["aa", "ee", "oo", "uu"]] },
            { lijn: "licht" },
            { soort: "klinker", rijen: [["ij", "oe", "ie", "ui"], ["ou", "eu", "ei", "au"]] },
            { lijn: "donker" },
            { soort: "medeklinker", rijen: [
                ["k", "m", "p", "n", "d"],
                ["r", "t", "s", "g", "z"],
                ["l", "v", "h", "b", "j"],
                ["f", "w"]
            ] }
        ],
        cijfers: [
            { soort: "medeklinker", map: "getallen", rijen: [reeks(0, 4), reeks(5, 9)] }
        ],
        getallen: [
            { soort: "medeklinker", map: "getallen", tekens: reeks(0, 9), perRij: 5, perRijBreed: 10 },
            { lijn: "licht" },
            { soort: "medeklinker", map: "getallen", tekens: reeks(10, 19), perRij: 5, perRijBreed: 10 },
            { lijn: "licht" },
            { soort: "medeklinker", map: "getallen", tekens: reeks(20, 29), perRij: 5, perRijBreed: 10 },
            { lijn: "licht" },
            { soort: "medeklinker", map: "getallen", tekens: reeks(30, 39), perRij: 5, perRijBreed: 10 },
            { lijn: "licht" },
            { soort: "medeklinker", map: "getallen", tekens: reeks(40, 49), perRij: 5, perRijBreed: 10 },
            { lijn: "licht" },
            { soort: "medeklinker", map: "getallen", tekens: ["50"], perRij: 5, perRijBreed: 10 }
        ]
    };

    /* ============================================================ */

    const KLINKERS = new Set(["a", "e", "i", "o", "u", "y", "aa", "ee", "oo", "uu",
        "ie", "oe", "eu", "ui", "ij", "ei", "ou", "au", "eeuw", "ieuw", "uw", "aai", "ooi", "oei"]);

    function eigenBord(tekst) {
        const groepen = [];
        tekst.split("|").map(r => r.trim()).filter(Boolean).forEach(rij => {
            if (rij === "-" || rij === "=") {
                groepen.push({ lijn: rij === "=" ? "donker" : "licht" });
                return;
            }
            const tekens = rij.split(",").map(t => t.trim()).filter(Boolean);
            if (!tekens.length) return;
            // Elk teken krijgt zijn eigen kleur en geluidsmap.
            tekens.forEach((t, i) => {
                const groep = {
                    soort: KLINKERS.has(t.toLowerCase()) ? "klinker" : "medeklinker",
                    map: /^\d+$/.test(t) ? "getallen" : "klanken"
                };
                if (i === 0) groepen.push({ rij: [] });
                groepen[groepen.length - 1].rij.push({ teken: t, groep });
            });
        });
        // Omzetten naar het gewone formaat: per rij één groep met per-teken info.
        return groepen.map(g => g.lijn ? g : { rijen: [g.rij.map(x => x.teken)], perTeken: g.rij.map(x => x.groep) });
    }

    const params = new URLSearchParams(location.search);
    if (params.get("rijen")) {
        const bord = eigenBord(params.get("rijen"));
        if (bord.some(g => g.rijen)) BORDEN.eigen = bord;
    }
    const bordNaam = BORDEN.eigen ? "eigen" : (BORDEN[params.get("bord")] ? params.get("bord") : "letters");
    const modus = ["lezen", "groot", "schrijven"].includes(params.get("modus")) ? params.get("modus") : "schrijven";
    // Icoontje: standaard volgens de werking, of zelf gekozen met icoon=.
    const icoonNaam = ["lezen", "luisteren", "schrijven", "geen"].includes(params.get("icoon"))
        ? params.get("icoon")
        : { lezen: "luisteren", groot: "lezen", schrijven: "schrijven" }[modus];
    // Uitlijning van rijen die niet vol zijn: links, midden of rechts.
    const uitlijning = ["links", "rechts"].includes(params.get("uitlijning")) ? params.get("uitlijning") : "midden";
    document.documentElement.dataset.uitlijning = uitlijning;
    const VENSTER_MS = 180;
    const bord = document.getElementById("bord");
    const overlay = document.getElementById("overlay");
    const kaart = document.getElementById("kaart");
    document.title = { letters: "Letterbord", cijfers: "Cijferbord", getallen: "Getallenbord" }[bordNaam] || "Letterbord";
    bord.setAttribute("aria-label", document.title);

    const ICONEN = {
        // leesblad met tekstregels (lezen)
        lezen: '<svg viewBox="0 0 120 80" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M44 6h24l12 12v56H44z"/><path d="M68 6v12h12"/><path d="M51 28h22M51 37h22M51 46h22M51 55h15"/></svg>',
        // oor met geluidsgolfjes (luisteren)
        luisteren: '<svg viewBox="0 0 120 80" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M50 30a15 15 0 1 1 27 9c-4 4-7 6-7 12 0 7-5 11-10 11s-8-3-9-6"/><path d="M58 31a7 7 0 1 1 12 4c-2 2-4 3-4 7"/><path d="M38 24c-4 5-4 13 0 18M31 18c-7 9-7 22 0 31"/></svg>',
        // potlood dat een lijn schrijft (schrijven)
        schrijven: '<svg viewBox="0 0 120 80" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 66c6-8 10-14 14-14s2 12 7 12 8-16 13-16 3 14 8 14 6-6 10-9"/><path d="M66 50l38-38a5 5 0 0 1 7 7L73 57l-10 3z"/><path d="M99 17l7 7"/><path d="M66 50l7 7"/></svg>'
    };

    let indeling = null;   // { rijen, lijnen, kolommen }
    let breedScherm = null;

    function rijenVan(groep, breed) {
        if (groep.rijen) return groep.rijen;
        const n = breed ? groep.perRijBreed : groep.perRij;
        const r = [];
        for (let i = 0; i < groep.tekens.length; i += n) r.push(groep.tekens.slice(i, i + n));
        return r;
    }

    function bouwBord() {
        breedScherm = window.innerWidth / window.innerHeight > 0.95;
        bord.querySelectorAll(".inhoud").forEach(el => el.remove());
        const inhoud = document.createElement("div");
        inhoud.className = "inhoud";
        bord.appendChild(inhoud);
        let rijen = 0, lijnen = 0, kolommen = 1, laatsteRij = 0;
        BORDEN[bordNaam].forEach(groep => {
            if (groep.lijn) {
                const l = document.createElement("div");
                l.className = "scheiding" + (groep.lijn === "donker" ? " donker" : "");
                inhoud.appendChild(l);
                lijnen++;
                return;
            }
            rijenVan(groep, breedScherm).forEach(rij => {
                const r = document.createElement("div");
                r.className = "rij";
                rij.forEach((teken, i) => {
                    const g = groep.perTeken ? groep.perTeken[i] : groep;
                    const b = document.createElement("button");
                    b.className = "tegel" + (g.soort === "klinker" ? " klinker" : "") + (teken.length > 1 ? " breed" : "");
                    if (teken.length > 2) b.style.fontSize = "calc(var(--t) * " + (teken.length > 3 ? 0.3 : 0.38) + ")";
                    b.textContent = teken;
                    b.setAttribute("aria-label", teken);
                    b.addEventListener("click", () => kies(teken, g));
                    r.appendChild(b);
                });
                inhoud.appendChild(r);
                rijen++;
                laatsteRij = rij.length;
                kolommen = Math.max(kolommen, rij.length);
            });
        });
        indeling = { rijen, lijnen, kolommen: Math.max(kolommen, 5) };

        const icoon = document.createElement("div");
        icoon.className = "modus-icoon";
        icoon.innerHTML = ICONEN[icoonNaam] || "";
        icoon.setAttribute("aria-hidden", "true");
        // Is de laatste rij kort (bv. 50, of f w), dan past het icoon links
        // ernaast. Anders komt er een smalle strook onder de tegels bij.
        // Bij links of rechts uitlijnen staat het icoon aan de lege kant.
        const vrij = Math.max(kolommen, 5) - laatsteRij;
        if (icoonNaam !== "geen" && vrij < (uitlijning === "midden" ? 2 : 1)) {
            const ruimte = document.createElement("div");
            ruimte.className = "icoon-ruimte";
            inhoud.appendChild(ruimte);
        }
        inhoud.appendChild(icoon);
        schaal();
    }

    // Tegelgrootte afstemmen op het beschikbare vlak (tablet, gsm, Genially-embed)
    // Meet hoe groot de tegels samen zijn en vergroot of verkleint ze zodat ze
    // het vak (tablet, gsm, Genially-insluitvak) zo goed mogelijk vullen.
    // Zo blijft er rond de tegels bijna geen lege rand over.
    function zetMaat(t, pad) {
        const st = document.documentElement.style;
        st.setProperty("--t", t + "px");
        st.setProperty("--gap", (t * 0.16) + "px");
        st.setProperty("--pad", pad + "px");
    }
    function schaal() {
        const { kolommen } = indeling;
        document.documentElement.style.setProperty("--kol", kolommen);
        const inhoud = bord.querySelector(".inhoud");
        const W = window.innerWidth, H = window.innerHeight;
        const pad = Math.max(6, Math.min(W, H) * 0.02);
        const beschikbaarB = W - 2 * pad, beschikbaarH = H - 2 * pad;
        let t = 100;
        for (let poging = 0; poging < 3; poging++) {
            zetMaat(t, pad);
            const breedte = inhoud.scrollWidth, hoogte = inhoud.scrollHeight;
            if (!breedte || !hoogte) break;
            const factor = Math.min(beschikbaarB / breedte, beschikbaarH / hoogte);
            const nieuw = Math.max(20, Math.min(150, t * factor));
            if (Math.abs(nieuw - t) < 0.3) break;
            t = nieuw;
        }
        zetMaat(Math.floor(t * 10) / 10, pad);
    }
    window.addEventListener("resize", () => {
        const breed = window.innerWidth / window.innerHeight > 0.95;
        if (breed !== breedScherm) bouwBord(); else schaal();
    });

    // Geluid
    // Alle klanken van het bord worden meteen bij het openen geladen, zodat
    // ook de eerste klik direct klinkt. De stilte vooraan in een opname wordt
    // overgeslagen (de bestanden zelf blijven ongewijzigd).
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = AudioCtx ? new AudioCtx() : null;
    const buffers = {};      // url -> { buf, start } of een Promise
    let bron = null;          // klank die nu speelt (Web Audio)
    let reserve = null;       // klank die nu speelt (gewone audio)

    function audioUrl(teken, groep) {
        const map = groep.map || "klanken";
        const naam = AUDIO_ALIAS[teken] || teken;
        return BASIS_AUDIO + map + "/" + encodeURIComponent(naam) + ".mp3";
    }

    function decodeer(data) {
        return new Promise((ok, fout) => {
            const p = ctx.decodeAudioData(data, ok, fout);
            if (p && p.then) p.then(ok, fout);
        });
    }

    function eersteGeluid(buf) {
        const drempel = 0.02, kanaal = buf.getChannelData(0);
        for (let i = 0; i < kanaal.length; i++) {
            if (Math.abs(kanaal[i]) > drempel) return Math.max(0, i / buf.sampleRate - 0.03);
        }
        return 0;
    }

    function laad(url) {
        if (!ctx) return Promise.resolve(null);
        if (!buffers[url]) {
            buffers[url] = fetch(url)
                .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
                .then(decodeer)
                .then(buf => (buffers[url] = { buf, start: eersteGeluid(buf) }))
                .catch(() => (buffers[url] = { mislukt: true }));
        }
        return Promise.resolve(buffers[url]);
    }

    function laadAlles() {
        const urls = [];
        BORDEN[bordNaam].forEach(g => {
            if (g.lijn) return;
            (g.rijen ? g.rijen.flat() : g.tekens).forEach((t, i) => urls.push(audioUrl(t, g.perTeken ? g.perTeken[i] : g)));
        });
        const lijst = [...new Set(urls)];
        let i = 0;
        const volgende = () => { if (i < lijst.length) laad(lijst[i++]).then(volgende); };
        for (let k = 0; k < 6; k++) volgende();
    }

    function stopKlank() {
        if (bron) { try { bron.stop(); } catch (e) {} bron = null; }
        if (reserve) { reserve.pause(); reserve = null; }
    }

    function speelKlank(teken, groep) {
        const url = audioUrl(teken, groep);
        stopKlank();
        const klaar = buffers[url];
        if (ctx && klaar && klaar.buf) {
            if (ctx.state === "suspended") ctx.resume();
            bron = ctx.createBufferSource();
            bron.buffer = klaar.buf;
            bron.connect(ctx.destination);
            bron.start(0, klaar.start);
        } else {
            // Nog niet geladen (of oude browser): gewone audio als reserve.
            reserve = new Audio(url);
            reserve.play().catch(() => {});
            laad(url);
        }
    }
    // Sommige tablets (iPad) laten pas geluid toe na een eerste aanraking.
    document.addEventListener("pointerdown", () => { if (ctx && ctx.state === "suspended") ctx.resume(); }, { once: true });

    // De klank valt samen met het beeld: bij de grote letter zodra het
    // venster open is, bij een filmpje zodra het eerste beeld verschijnt.
    let klikNummer = 0;
    function kies(teken, groep) {
        const nummer = ++klikNummer;
        let gespeeld = false;
        const klank = () => {
            if (gespeeld || nummer !== klikNummer || !overlay.classList.contains("open")) return;
            gespeeld = true;
            speelKlank(teken, groep);
        };
        // Nooit voor het venster helemaal open is.
        const start = performance.now();
        const naVenster = () => setTimeout(klank, Math.max(0, VENSTER_MS - (performance.now() - start)));
        if (modus === "lezen") {
            speelKlank(teken, groep);
        } else if (modus === "groot") {
            toonLetter(teken, groep);
            naVenster();
        } else {
            toonVideo(teken, groep, naVenster);
            // Laadt het filmpje traag, dan toch niet langer dan even wachten.
            setTimeout(klank, 900);
        }
    }

    function toonLetter(teken, groep) {
        kaart.className = "kaart letter";
        kaart.style.aspectRatio = "";
        kaart.style.width = "";
        kaart.innerHTML = "";
        const g = document.createElement("div");
        g.className = "groot" + (groep.soort === "klinker" ? " klinker" : "");
        g.textContent = teken;
        kaart.appendChild(g);
        openOverlay();
    }

    function maakVideo(naam) {
        const v = document.createElement("video");
        v.src = BASIS_VIDEO + encodeURIComponent(naam) + ".mp4";
        v.muted = true;
        v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.setAttribute("webkit-playsinline", "");
        v.preload = "auto";
        v.disablePictureInPicture = true;
        return v;
    }

    // Getallen van twee cijfers: eerst het filmpje van het eerste cijfer,
    // daarna dat van het tweede, naast elkaar - zoals je het getal schrijft.
    // Schrijffilmpje van één letter, klank of cijfer. Getallen vanaf 10
    // krijgen geen filmpje maar het grote getal.
    function toonVideo(teken, groep, bijStart) {
        if (groep.map === "getallen" && teken.length > 1) {
            toonLetter(teken, groep);
            bijStart();
            return;
        }
        kaart.className = "kaart film";
        kaart.style.aspectRatio = "";
        kaart.style.width = "";
        kaart.innerHTML = "";
        const v = maakVideo(teken);

        const opnieuw = document.createElement("button");
        opnieuw.className = "opnieuw";
        opnieuw.setAttribute("aria-label", "Opnieuw afspelen");
        opnieuw.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>';

        const speel = () => { opnieuw.classList.remove("zichtbaar"); v.currentTime = 0; v.play().catch(() => {}); };
        v.addEventListener("ended", () => opnieuw.classList.add("zichtbaar"));
        v.addEventListener("click", speel);
        // De klank start samen met het eerste beeld van het filmpje.
        v.addEventListener("playing", bijStart, { once: true });
        // Nog geen filmpje voor dit teken? Dan tonen we de grote letter.
        v.addEventListener("error", () => { toonLetter(teken, groep); bijStart(); }, { once: true });
        opnieuw.addEventListener("click", e => { e.stopPropagation(); speel(); });
        kaart.appendChild(v);
        kaart.appendChild(opnieuw);
        openOverlay();
        v.play().catch(() => {});
    }

    function openOverlay() { overlay.classList.add("open"); }
    function sluitOverlay() {
        klikNummer++;
        overlay.classList.remove("open");
        kaart.querySelectorAll("video").forEach(v => v.pause());
    }
    document.getElementById("sluit").addEventListener("click", sluitOverlay);
    overlay.addEventListener("click", e => { if (e.target === overlay) sluitOverlay(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") sluitOverlay(); });

    bouwBord();
    laadAlles();
</script>
</body>
</html>
